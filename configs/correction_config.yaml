paths:
  base_dir: "project"
  vocab_file: "data/external/vocabulary.txt"
  stopwords_file: "data/external/vietnamese-stopwords.txt"
  telex_file: "data/external/telex.txt"
  teen_code_file: "data/external/teen_code.txt"
  trigram_lm_file: "models/trigram.bin"
  skipgram_model_file: "models/model_skipgram.pth"
  skipgram_model_url: "1gxVmxa-6jf5wbDBoCyd_VauUuV5wo2Du"
  lightgbm_data_file: "data/processed/dataset_spell_correction.npz"

model:
  embed_dim: 300
  window_size: 3

skipgram_training:
  batch_size: 1024
  epochs: 20
  learning_rate: 0.001

ranker_training:
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  random_state: 42
  eval_at: [1, 3, 5]

detector_heuristics:
  alpha: 4.6
  hard_ceiling: -3.9
  hard_floor: -6.26

candidate_generation:
  top_k_raw: 5
  max_delete_k: 2
  sub_cost_confusion: 0.4
  sub_cost_adjacent: 0.5
  transposition_cost: 0.5

feature_normalization:
  kenlm_min_max_ceiling: 15.0
  log_norm_unigram: 15.0
  log_norm_bigram: 12.0
  log_norm_trigram: 12.0

feature_weights:
  w_kenlm: 0.25
  w_edit: 0.20
  w_len: 0.10
  w_bigram: 0.15
  w_trigram: 0.10
  w_unigram: 0.05
  w_sim: 0.15

confusion_pairs: {}
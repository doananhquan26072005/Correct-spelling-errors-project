# Data Paths & Columns
data:
  csv_path: "data/raw/viet_khong_dau.csv"
  words_path: "data/external/words.txt"
  input_col: "input"
  target_col: "target"
  train_ratio: 0.8
  valid_ratio: 0.1
  test_ratio: 0.1

# Vocabulary configuration
vocab:
  max_word_vocab_size: 50000
  min_word_freq: 2          # Adjusted: Filter out low-frequency noise/typos

# Data Generation / Augmentation
augmentation:
  lowercase: true
  use_word_pairs: true      # Adjusted: Enable word pairs to strengthen dictionary context
  max_word_pairs: 30000
  use_sentence_chunks: true
  chunk_min_words: 5
  chunk_max_words: 24
  chunk_stride: 2
  max_train_samples: 300000

# Model Architecture
model:
  max_len: 256
  d_model: 192
  char_emb_dim: 128
  word_emb_dim: 64
  nhead: 4
  num_encoder_layers: 4
  dim_feedforward: 768
  dropout: 0.15             # Adjusted: Slightly reduced to prevent underfitting in small networks

# Hyperparameters & Training Settings
training:
  batch_size: 128           # Adjusted: Scale to 128 if VRAM allows for smoother gradients
  epochs: 60                # Adjusted: 60 epochs is usually sufficient with adaptive LR scheduling
  learning_rate: 3.0e-4     # Adjusted: Faster initial convergence for AdamW
  weight_decay: 1.0e-2      # Adjusted: Standard AdamW weight decay instead of 1e-4
  grad_clip: 1.0
  seed: 42
  checkpoint_path: "models/accent_tagger_context_v3.pt"
  device: "auto"

# Loss & Constraints
loss:
  copy_loss_weight: 1.0
  accent_loss_weight: 4.0   # Adjusted: Balanced ratio to mitigate over-correction tendency
  use_constraint_in_training: true